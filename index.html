uted);font-weight:800}.field input,.field select,.field textarea{width:100%;background:#080d1d;border:1px solid #1a2b70;border-radius:10px;color:var(--text);padding:12px;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--cyan)}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.stat{background:#0b1123;border:1px solid #1a2b70;padding:15px;border-radius:13px}.stat small{display:block;color:var(--muted);font-size:11px}.stat b{font-size:25px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px;margin-top:14px}table{border-collapse:collapse;width:100%;min-width:650px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px;background:#0b1b2b}tr:last-child td{border:0}.positive{color:var(--green)}.negative{color:var(--red)}.notice{border:1px solid var(--line);padding:12px;border-radius:11px;margin:9px 0;color:var(--muted)}.hide{display:none!important}.toast{position:fixed;right:18px;bottom:18px;background:#102b40;border:1px solid #28617b;border-radius:12px;padding:13px 17px;z-index:50;box-shadow:0 12px 35px #0008;max-width:90vw}.modal{position:fixed;inset:0;background:#020914cc;z-index:40;display:grid;place-items:center;padding:18px}.modalbox{width:min(470px,100%);background:#0d1530;border:1px solid #263a9b;border-radius:18px;padding:22px}.footer{border-top:1px solid var(--line);padding:24px 0;color:var(--muted);font-size:12px}.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}.adminTabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.adminTabs button{background:#132a40;color:var(--muted);border:1px solid var(--line);padding:9px 12px;border-radius:9px}.adminTabs button.active{color:var(--cyan);border-color:var(--cyan)}.hint{font-size:12px;color:var(--muted)}@media(max-width:850px){nav{display:none}.hero{grid-template-columns:1fr;padding-top:40px}.heroart{min-height:220px}.grid{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.wrap{padding:0 14px}.grid{grid-template-columns:1fr}.two{grid-template-columns:1fr}.hero h1{letter-spacing:-2px}.head{align-items:start;flex-direction:column}.right .profileName{display:none}.pageTitle{font-size:29px}.bar{height:64px}}

<body>
<header class="top"><div class="wrap bar"><a class="brand" href="#" onclick="go('home');return false"><span class="brandmark">⚔</span><span>PRIME<span class="cyan">TOUR</span><small>ESPORTS ARENA</small></span></a><nav id="nav"></nav><div class="right" id="account"></div></div></header>
<div class="wrap" id="app"></div><footer class="footer"><div class="wrap row"><span>© PrimeTour Esports Arena</span><span>Compete • Conquer • Repeat</span></div></footer>
<div id="toast" class="toast hide"></div><div id="modal" class="modal hide"><div class="modalbox" id="modalbox"></div></div>
<script>
/* Configure API_BASE to your deployed PrimeTour server. Keep wallet operations server-side. */
const API_BASE=localStorage.getItem('pt_api_base')||((location.protocol==='http:'||location.protocol==='https:')?location.origin+'/api':'http://localhost:4000/api');
let token=localStorage.getItem('pt_token')||'',me=null,wallet=null,tournaments=[],transactions=[],page='home',joinTarget=null,adminTab='overview',adminTournament='',adminPlayers=[],selectedUser='',rewardAmount=500,report=null;
const $=id=>document.getElementById(id), money=n=>'৳'+Number(n||0).toLocaleString('en-BD'), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(s){$('toast').textContent=s;$('toast').classList.remove('hide');setTimeout(()=>$('toast').classList.add('hide'),3200)}
async function api(path,opts={}){let r=await fetch(API_BASE+path,{...opts,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(opts.headers||{})}});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Server request failed');return d}
async function run(fn){try{await fn()}catch(e){toast(e.message)}}
function nav(){let items=[['home','Home'],['tournaments','Tournaments'],['mine','My Tournaments'],['wallet','Wallet'],['leaderboard','Leaderboard']];$('nav').innerHTML=items.map(([id,n])=>`<button class="${page===id?'active':''}" onclick="go('${id}')">${n}</button>`).join('');$('account').innerHTML=me?`<button class="ghost profileName" onclick="go('profile')">${esc(me.ign||me.playerId||'Profile')}</button>${me.role==='ADMIN'&&me.email?.toLowerCase()==='nibirgaming07@gmail.com'?'<button class="btn small" onclick="go(\'admin\')">Admin Panel</button>':''}<button class="btn alt small" onclick="logout()">Logout</button>`:'<button class="btn small" onclick="go(\'login\')">Login</button>'}
async function refresh(){tournaments=await api('/tournaments').catch(()=>[]);if(token){try{me=await api('/me');let w=await api('/wallet');wallet=w.balance;transactions=w.transactions||[]}catch(e){logout(false)}}nav();render()}
function go(p){page=p;nav();render();window.scrollTo(0,0)}
function logout(show=true){localStorage.removeItem('pt_token');token='';me=null;wallet=null;transactions=[];if(show)toast('Logged out');go('home')}
function fmt(d){return d?new Date(d).toLocaleString():'—'}
function tournamentCard(t){let used=Number(t.maxPlayers||0)-Number(t.slots||0);return `<article class="card"><div class="row"><span class="tag">${esc(t.type||'TOURNAMENT')}</span><span class="hint">${esc(t.status)}</span></div><h3>${esc(t.title)}</h3><p class="muted">${esc(t.description||'Compete for the prize pool.')}</p><div class="meta"><div><small>Entry fee</small><b>${money(t.entryFee)}</b></div><div><small>Prize pool</small><b class="cyan">${money(t.prizePool)}</b></div><div><small>Slots left</small><b>${Math.max(0,Number(t.slots||0))} / ${t.maxPlayers}</b></div><div><small>Match time</small><b>${fmt(t.matchAt)}</b></div></div><div class="row"><span class="hint">${used} joined</span><button class="btn small" ${t.status!=='PUBLISHED'||Number(t.slots)<=0?'disabled':''} onclick="askJoin('${esc(t.id)}')">JOIN TOURNAMENT</button></div></article>`}
function render(){let root=$('app');if(page==='home'||page==='tournaments'){root.innerHTML=(page==='home'?`<section class="hero"><div><div class="eyebrow">BANGLADESH • COMPETITIVE GAMING</div><h1>ENTER THE<br><span class="gradient">BATTLE ARENA.</span></h1><p>Compete with the best. Prove your skills. Claim your glory. Your next championship starts here.</p><button class="btn" onclick="go('tournaments')">Explore tournaments ↗</button> <button class="btn alt" onclick="go('${me?'profile':'register'}')">${me?'My profile':'Create account'}</button><div class="stats"><div class="stat"><small>TOURNAMENTS</small><b>${tournaments.length}</b></div><div class="stat"><small>WALLET</small><b>${me?money(wallet):'—'}</b></div></div></div><div class="heroart"><div class="orbit"></div><div class="emblem">PT</div><span class="float f1">⚡ NEXT LEVEL</span><span class="float f2">#PLAY TO WIN</span></div></section>`:`<section class="page"><div class="eyebrow">FIND YOUR NEXT MATCH</div><h1 class="pageTitle">All <span class="cyan">tournaments</span></h1><p class="muted">Browse competitions and secure your spot.</p></section>`)+`<section class="section"><a class="topup-banner" href="https://seikehnibirahamed-cloud.github.io/KinoBangladesh/" target="_blank" rel="noopener"><span class="topup-gem">💎</span><span><small>PRIMETOUR STORE PARTNER</small><strong>কম দামে DIAMOND TOP UP</strong><em>আমার উপর CLICK করুন ↗</em></span></a></section><section class="section"><div class="head"><div><div class="eyebrow">COMPETE • CONQUER • REPEAT</div><h2>Featured <span class="cyan">tournaments</span></h2></div><button class="ghost" onclick="go('tournaments')">View all →</button></div><div class="grid">${tournaments.length?tournaments.map(tournamentCard).join(''):'<div class="empty">No tournaments published yet. Connect the backend and publish a tournament.</div>'}</div></section>`;return}
if(page==='login'||page==='register'){document.body.classList.add('auth-mode');root.innerHTML=`<section class="auth-wrap"><div class="auth-card"><div class="auth-logo"><div class="auth-crest"><span>PT</span></div></div><h1 class="auth-title">${page==='login'?'Welcome Back':'Create an account'}</h1><p class="auth-subtitle">${page==='login'?'Sign in to continue your journey':'Start your journey with us'}</p>${page==='login'?`<button class="auth-help" type="button" onclick="toast('For account help, contact PrimeTour support')"><span class="play-icon">▶</span><span>account khulte na parle ei khane click kore video dekhun</span></button><div class="auth-field"><label>Email or Username</label><div class="auth-input"><span class="auth-field-icon">♟</span><input id="identity" autocomplete="username" placeholder="Enter your email or username"></div></div><div class="auth-field"><label>Password</label><div class="auth-input"><span class="auth-field-icon">▣</span><input id="password" type="password" autocomplete="current-password" placeholder="Enter your password"><button class="eye-btn" type="button" onclick="toggleAuthEye('password',this)">◉</button></div></div><div class="auth-options"><label class="remember"><input type="checkbox" id="remember"> <span>Remember Me</span></label><a href="#" onclick="toast('Please contact PrimeTour support to recover your account');return false">Forgot Username or Password?</a></div><button class="auth-submit" onclick="loginNow()">Login <span>→</span></button><p class="auth-switch">Don’t have an account? <a href="#" onclick="go('register');return false">Sign Up</a></p>`:`<div class="auth-field"><label>Username</label><div class="auth-input"><span class="auth-field-icon">♟</span><input id="username" autocomplete="username" placeholder="Enter your username"></div></div><div class="auth-field"><label>Email</label><div class="auth-input"><span class="auth-field-icon">✉</span><input id="email" type="email" autocomplete="email" placeholder="Tap to select Gmail account"></div></div><div class="auth-field"><label>Phone Number</label><div class="auth-input"><span class="phone-prefix">+88</span><input id="phone" type="tel" inputmode="numeric" maxlength="11" placeholder="Enter 11-digit number"></div></div><div class="auth-field"><label>Password</label><div class="auth-input"><span class="auth-field-icon">▣</span><input id="password" type="password" autocomplete="new-password" placeholder="Enter your password"><button class="eye-btn" type="button" onclick="toggleAuthEye('password',this)">◉</button></div></div><div class="auth-field"><label>Confirm Password</label><div class="auth-input"><span class="auth-field-icon">▣</span><input id="confirmPassword" type="password" autocomplete="new-password" placeholder="Confirm your password"><button class="eye-btn" type="button" onclick="toggleAuthEye('confirmPassword',this)">◉</button></div></div><label class="agree-rules"><input id="agreeRules" type="checkbox"><span>I agree to all Rules, Regulations and Policy</span></label><button class="auth-submit" onclick="registerNow()">Create Account <span>→</span></button><p class="auth-switch">Already have an account? <a href="#" onclick="go('login');return false">Login</a></p>`}</div></section>`;return}document.body.classList.remove('auth-mode');if(page==='wallet'){if(!me){root.innerHTML=needLogin();return}root.innerHTML=`<section class="page"><div class="eyebrow">PLAYER FINANCE</div><h1 class="pageTitle">My <span class="cyan">Wallet</span></h1><div class="panel"><div class="hint">AVAILABLE BALANCE</div><div style="font-size:42px;font-weight:950">${money(wallet)}</div><p class="hint">Balance is read from the connected backend. Players cannot edit wallet balances.</p></div><div class="grid" style="margin-top:16px"><div class="panel"><h3>Request Deposit</h3><p class="hint">Send payment first, then submit the transaction reference for admin verification.</p>${walletForm('DEPOSIT')}</div><div class="panel"><h3>Request Withdrawal</h3>${walletForm('WITHDRAWAL')}</div></div><h2 style="margin-top:28px">Transaction History</h2>${transactionTable(transactions)}</section>`;return}
if(page==='mine'){if(!me){root.innerHTML=needLogin();return}let regs=me.registrations||[];root.innerHTML=`<section class="page"><div class="eyebrow">YOUR COMPETITIVE HISTORY</div><h1 class="pageTitle">My <span class="cyan">Tournaments</span></h1><div class="grid">${regs.length?regs.map(r=>`<div class="card"><span class="tag">${esc(r.status)}</span><h3>${esc(r.tournament?.title||'Tournament')}</h3><div class="meta"><div><small>Entry paid</small><b>${money(r.entryFeePaid)}</b></div><div><small>Match time</small><b>${fmt(r.tournament?.matchAt)}</b></div></div><p class="hint">Room: ${esc(r.tournament?.roomId||'Not published')} · Password: ${esc(r.tournament?.roomPassword||'—')}</p></div>`).join(''):'<div class="empty">You have not joined any tournaments yet.</div>'}</div></section>`;return}
if(page==='profile'){if(!me){root.innerHTML=needLogin();return}root.innerHTML=`<section class="page"><div class="eyebrow">PLAYER PROFILE</div><h1 class="pageTitle">${esc(me.ign||'Player')}</h1><div class="panel"><div class="stats"><div class="stat"><small>USER ID</small><b style="font-size:18px">${esc(me.playerId)}</b></div><div class="stat"><small>WALLET</small><b>${money(wallet)}</b></div><div class="stat"><small>ROLE</small><b>${esc(me.role)}</b></div><div class="stat"><small>EMAIL</small><b style="font-size:13px">${esc(me.email||'—')}</b></div></div><p class="hint">Admin Panel is visible only when the backend confirms ADMIN role and the authorized Gmail.</p></div><a class="developer-link" href="https://www.facebook.com/share/14rgMRqakwi/" target="_blank" rel="noopener"><span class="developer-icon">⌘</span><span><strong>Developer Profile</strong><small>Connect with the developer ↗</small></span><b>›</b></a></section>`;return}
if(page==='leaderboard'){root.innerHTML=`<section class="page"><h1 class="pageTitle">Arena <span class="cyan">Leaderboard</span></h1><div id="leader" class="empty">Loading leaderboard…</div></section>`;run(async()=>{let rows=await api('/leaderboard');$('leader').innerHTML=rows.length?`<div class="tablewrap"><table><tr><th>Player</th><th>Matches</th><th>Kills</th><th>Points</th><th>Rewards</th></tr>${rows.map(x=>`<tr><td>${esc(x.user?.ign||x.user?.playerId)}</td><td>${x._count?._all||0}</td><td>${x._sum?.kills||0}</td><td>${x._sum?.points||0}</td><td>${money(x._sum?.prizeMoney)}</td></tr>`).join('')}</table></div>`:'No results yet.'});return}
if(page==='admin'){if(!isAdmin()){root.innerHTML=needAdmin();return}adminRender();return}
}
function needLogin(){return `<section class="page"><div class="empty">Please <button class="btn small" onclick="go('login')">Login</button> to continue.</div></section>`}
function isAdmin(){return !!(me&&me.role==='ADMIN'&&me.email?.toLowerCase()==='nibirgaming07@gmail.com')}
function needAdmin(){return `<section class="page"><div class="panel form"><div class="eyebrow">RESTRICTED AREA</div><h1>Admin access required</h1><p class="muted">Only the authorized admin account can access this section. Permission is verified by the backend.</p><button class="btn" onclick="go('login')">Admin Login</button></div></section>`}
function walletForm(type){return `<div class="field"><label>Amount (BDT)</label><input id="${type}amount" type="number" min="10" value="100"></div><div class="field"><label>Payment method</label><select id="${type}method"><option>bKash</option><option>Nagad</option><option>Rocket</option></select></div><div class="field"><label>Transaction reference</label><input id="${type}ref" placeholder="Payment transaction ID"></div><button class="btn alt" onclick="walletRequest('${type}')">SUBMIT REQUEST</button>`}
function transactionTable(rows){return rows?.length?`<div class="tablewrap"><table><tr><th>Date</th><th>Type</th><th>Reference</th><th>Amount</th><th>Status</th></tr>${rows.map(t=>`<tr><td>${fmt(t.createdAt)}</td><td>${esc(t.type)}</td><td>${esc(t.transactionRef||t.reference||t.id)}</td><td class="${['PRIZE','REFUND','DEPOSIT'].includes(t.type)?'positive':'negative'}">${['PRIZE','REFUND','DEPOSIT'].includes(t.type)?'+':'−'}${money(t.amount)}</td><td>${esc(t.status)}</td></tr>`).join('')}</table></div>`:'<div class="empty">No transactions found.</div>'}
function askJoin(id){if(!me){go('login');return}let t=tournaments.find(x=>x.id===id);if(!t)return;joinTarget=t;$('modalbox').innerHTML=`<div class="eyebrow">CONFIRM ENTRY</div><h2>${esc(t.title)}</h2><p class="muted">Tournament entry fee will be deducted from your real wallet after the server validates your account, balance, slots and duplicate registration.</p><div class="meta"><div><small>Entry fee</small><b>${money(t.entryFee)}</b></div><div><small>Current balance</small><b>${money(wallet)}</b></div><div><small>After joining</small><b>${money(Number(wallet)-Number(t.entryFee))}</b></div></div><div class="row"><button class="btn alt" onclick="closeModal()">CANCEL</button><button class="btn" onclick="confirmJoin()">CONFIRM & JOIN</button></div>`;$('modal').classList.remove('hide')}
function closeModal(){$('modal').classList.add('hide')}
async function confirmJoin(){if(!joinTarget)return;await run(async()=>{await api(`/tournaments/${joinTarget.id}/join`,{method:'POST',body:JSON.stringify({ign:me.ign||undefined,freeFireUid:me.freeFireUid||undefined})});closeModal();toast('Congratulations! Tournament joined successfully.');await refresh()})}
async function loginNow(){await run(async()=>{let d=await api('/auth/login',{method:'POST',body:JSON.stringify({identity:$('identity').value,password:$('password').value})});token=d.token;localStorage.setItem('pt_token',token);await refresh();go('home');toast('Login successful')})}
function toggleAuthEye(id,btn){let x=$(id);x.type=x.type==='password'?'text':'password';btn.textContent=x.type==='password'?'◉':'◎'}
async function registerNow(){let username=$('username').value.trim(),email=$('email').value.trim(),phone=$('phone').value.trim(),password=$('password').value,confirm=$('confirmPassword').value;if(!username||!email||!phone||!password||!confirm){toast('Please fill in all fields');return}if(!/^[0-9]{11}$/.test(phone)){toast('Enter a valid 11-digit phone number');return}if(password!==confirm){toast('Passwords do not match');return}if(!$('agreeRules').checked){toast('Please agree to the Rules, Regulations and Policy');return}await run(async()=>{let d=await api('/auth/register',{method:'POST',body:JSON.stringify({username,email,phone:'+88'+phone,password,ign:username})});token=d.token;localStorage.setItem('pt_token',token);await refresh();go('profile');toast('Account created')})}
async function walletRequest(type){await run(async()=>{await api('/wallet/request',{method:'POST',body:JSON.stringify({type,amount:Number($(type+'amount').value),method:$(type+'method').value,reference:$(type+'ref').value})});toast('Request sent for admin verification');await refresh()})}
async function adminRender(){let root=$('app');root.innerHTML=`<section class="page"><div class="eyebrow">AUTHORIZED CONTROL CENTER</div><h1 class="pageTitle">Admin <span class="cyan">Panel</span></h1><p class="hint">Signed in as ${esc(me.email)} · Server-verified administrator</p><div class="adminTabs">${[['overview','Overview'],['players','Players & Results'],['rewards','Distribute Rewards'],['transactions','Transactions'],['reports','Financial Reports'],['create','Create Tournament']].map(([id,n])=>`<button class="${adminTab===id?'active':''}" onclick="adminTab='${id}';adminRender()">${n}</button>`).join('')}</div><div id="adminContent"><div class="empty">Loading secure admin data…</div></div></section>`;await run(async()=>{if(adminTab==='overview'){let d=await api('/admin/overview');$('adminContent').innerHTML=`<div class="stats">${[['Players',d.users],['Tournaments',d.tournaments],['Registrations',d.registrations],['Pending transactions',d.pending]].map(([n,v])=>`<div class="stat"><small>${n}</small><b>${v}</b></div>`).join('')}</div><p class="hint">Approved transaction volume: ${money(d.approvedVolume)}</p>`}else if(adminTab==='players'||adminTab==='rewards'){let ts=tournaments; if(!ts.length)ts=await api('/tournaments');adminTournament=adminTournament||ts.find(t=>t.status==='COMPLETED')?.id||ts[0]?.id||'';$('adminContent').innerHTML=`<div class="panel"><div class="field"><label>Select tournament</label><select id="adminT">${ts.map(t=>`<option value="${esc(t.id)}" ${t.id===adminTournament?'selected':''}>${esc(t.title)} · ${esc(t.status)}</option>`).join('')}</select></div><div class="field"><label>Search by User ID, IGN, Free Fire UID or Team name</label><input id="searchQ" placeholder="Search player…"></div><button class="btn alt" onclick="adminTournament=$('adminT').value;searchPlayers()">SEARCH PARTICIPANTS</button><div id="playersTable"></div></div>${adminTab==='rewards'?rewardForm():resultForm()}`}else if(adminTab==='transactions'){let tx=await api('/admin/transactions');$('adminContent').innerHTML=transactionTable(tx)}else if(adminTab==='reports'){report=await api('/admin/financial-report');$('adminContent').innerHTML=`<pre class="panel" style="white-space:pre-wrap;overflow:auto">${esc(JSON.stringify(report,null,2))}</pre>`}else if(adminTab==='create'){$('adminContent').innerHTML=createForm()}})}
function rewardForm(){return `<div class="panel" style="margin-top:14px"><h3>DISTRIBUTE WINNING REWARDS</h3><p class="hint">Select an eligible participant from the search results, then confirm. Bulk reward sends the same amount to every loaded participant; use only when intended.</p><div class="two"><div class="field"><label>Reward amount (BDT)</label><input id="rewardAmount" type="number" min="1" value="500"></div><div class="field"><label>Description</label><input id="rewardDesc" value="Tournament winning reward"></div></div><button class="btn" onclick="sendReward()">SEND REWARD TO SELECTED PLAYER</button> <button class="btn alt" onclick="bulkReward()">SEND TO ALL LOADED PLAYERS</button><p class="hint">Duplicate reward protection and wallet credit are enforced by the backend.</p></div>`}
function resultForm(){return `<div class="panel" style="margin-top:14px"><h3>Match result entry</h3><div class="two"><div class="field"><label>Placement</label><input id="placement" type="number" value="1"></div><div class="field"><label>Kills</label><input id="kills" type="number" value="0"></div><div class="field"><label>Damage</label><input id="damage" type="number" value="0"></div><div class="field"><label>Total points</label><input id="points" type="number" value="0"></div></div><button class="btn" onclick="saveResult()">SAVE RESULT FOR SELECTED PLAYER</button> <button class="btn alt" onclick="completeTournament()">MARK TOURNAMENT COMPLETED</button></div>`}
function createForm(){return `<div class="panel"><h3>Publish Tournament</h3><div class="two"><div class="field"><label>Tournament name</label><input id="ctitle"></div><div class="field"><label>Type</label><select id="ctype"><option>Squad</option><option>Duo</option><option>Solo</option><option>Lone Wolf</option><option>Clash Squad</option></select></div><div class="field"><label>Entry fee</label><input id="cfee" type="number" value="20"></div><div class="field"><label>Prize pool</label><input id="cprize" type="number" value="1000"></div><div class="field"><label>Total slots</label><input id="cslots" type="number" value="48"></div><div class="field"><label>Match date & time</label><input id="cmatch" type="datetime-local"></div><div class="field"><label>Registration deadline</label><input id="cdeadline" type="datetime-local"></div><div class="field"><label>Map</label><input id="cmap" value="Bermuda"></div></div><button class="btn" onclick="createTournament()">PUBLISH TOURNAMENT</button></div>`}
async function searchPlayers(){await run(async()=>{adminTournament=$('adminT').value;adminPlayers=await api(`/admin/tournaments/${adminTournament}/players?q=${encodeURIComponent($('searchQ').value)}`);$('playersTable').innerHTML=adminPlayers.length?`<div class="tablewrap"><table><tr><th>Select</th><th>User ID</th><th>IGN</th><th>Free Fire UID</th><th>Team</th><th>Paid</th></tr>${adminPlayers.map(p=>`<tr><td><input type="radio" name="winner" value="${esc(p.userId)}" onchange="selectedUser=this.value" ${selectedUser===p.userId?'checked':''}></td><td>${esc(p.user.playerId)}</td><td>${esc(p.user.ign)}</td><td>${esc(p.user.freeFireUid)}</td><td>${esc(p.teamName||'—')}</td><td>${money(p.entryFeePaid)}</td></tr>`).join('')}</table></div>`:'<div class="empty">No registered players found.</div>'})}
async function sendReward(){await run(async()=>{if(!selectedUser)throw Error('Select a player first');let amount=Number($('rewardAmount').value),description=$('rewardDesc').value;if(!confirm(`Send ${money(amount)} reward to selected player?`))return;await api('/admin/rewards',{method:'POST',body:JSON.stringify({tournamentId:adminTournament,userId:selectedUser,amount,description})});toast('Winning reward sent successfully');await searchPlayers()})}
async function bulkReward(){await run(async()=>{if(!adminPlayers.length)throw Error('Search and load participants first');let amount=Number($('rewardAmount').value),description=$('rewardDesc').value;if(!confirm(`Send ${money(amount)} to ALL ${adminPlayers.length} loaded players?`))return;await api('/admin/rewards/bulk',{method:'POST',body:JSON.stringify({tournamentId:adminTournament,description,rewards:adminPlayers.map(p=>({userId:p.userId,amount}))})});toast('Bulk reward distribution complete');await searchPlayers()})}
async function saveResult(){await run(async()=>{if(!selectedUser)throw Error('Select a registered player first');let p=adminPlayers.find(x=>x.userId===selectedUser);await api(`/admin/tournaments/${adminTournament}/results`,{method:'POST',body:JSON.stringify({results:[{userId:selectedUser,teamName:p.teamName||p.user.ign||'Player',playerName:p.user.ign||'',placement:Number($('placement').value),kills:Number($('kills').value),damage:Number($('damage').value),points:Number($('points').value)}]})});toast('Match result saved')})}
async function completeTournament(){if(!confirm('Mark this tournament completed? Rewards can be distributed only after completion.'))return;await run(async()=>{await api(`/admin/tournaments/${adminTournament}`,{method:'PATCH',body:JSON.stringify({status:'COMPLETED'})});toast('Tournament completed');await refresh();adminTab='rewards';go('admin')})}
async function createTournament(){await run(async()=>{let matchAt=new Date($('cmatch').value).toISOString(),registrationDeadline=new Date($('cdeadline').value).toISOString();await api('/admin/tournaments',{method:'POST',body:JSON.stringify({title:$('ctitle').value,type:$('ctype').value,entryFee:Number($('cfee').value),prizePool:Number($('cprize').value),maxPlayers:Number($('cslots').value),matchAt,registrationDeadline,map:$('cmap').value,status:'PUBLISHED'})});toast('Tournament published');await refresh();go('tournaments')})}
(async()=>{try{await refresh()}catch(e){toast('Backend not connected: configure API_BASE.')}if(!tournaments.length&&!me)render()})();
</script></body></html>
